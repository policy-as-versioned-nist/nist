name: cut-release

# Ticket mo-10 (policy-as-versioned-flux). Creates a gitsign-signed, semver
# git tag and pushes it -- the ONLY way a release starts (git push, never the
# git-data REST API: see the hub repo's enact_guard.py governance rule).
#
# Signs keyless via this run's own GitHub Actions identity, not a human
# Google/Microsoft identity: gitsign auto-detects the Actions ambient
# credential (present because of the id-token permission below) and needs no
# browser/device-code interaction. This is a deliberate variant of the
# identity ADR-0001 describes for the sibling policy/fleet repos (a human,
# chris@cns.me.uk via Google) -- an unattended agent may not drive an
# interactive Google OAuth consent on a person's behalf, so the workflow's
# own machine identity is the signer instead. Same keyless -> Fulcio -> Rekor
# provenance chain; a different, equally real identity. See release.yml for
# the matching identity-pinned verification.
#
# workflow_dispatch only, on purpose: this is a release-cutting ACT, not a
# standing recurring automation.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "catalogue vX.Y.Z or publisher-reliability/vX.Y.Z tag to cut"
        required: true
      message:
        description: "annotated tag message -- what changed and why"
        required: true

permissions:
  contents: write
  id-token: write

env:
  GITSIGN_VERSION: 0.17.1
  GITSIGN_SHA256: 69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: select the bounded publication family
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          case "$VERSION_INPUT" in
            publisher-reliability/v*)
              [[ "$VERSION_INPUT" =~ ^publisher-reliability/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'FAIL: malformed report version'; exit 1; }
              [ "$GITHUB_REF" = refs/heads/main ] || { echo 'FAIL: report cuts require main'; exit 1; }
              echo 'PUBLICATION_KIND=report' >> "$GITHUB_ENV"
              ;;
            v[0-9]*.[0-9]*.[0-9]*) echo 'PUBLICATION_KIND=catalogue' >> "$GITHUB_ENV" ;;
            *) echo 'FAIL: unknown publication family'; exit 1 ;;
          esac

      - name: install pinned gitsign (binary + checksum, no marketplace action)
        run: |
          set -euo pipefail
          curl -sSL -o gitsign "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION}_linux_amd64"
          echo "${GITSIGN_SHA256}  gitsign" | sha256sum -c -
          chmod +x gitsign && sudo mv gitsign /usr/local/bin/gitsign

      # Ticket 43 (18 Answer 5): the bump is DECLARED in a reviewed file and
      # the gate refuses when the computed bump disagrees -- before the tag
      # exists, so a wrong number is never signed. The dispatch input reaches
      # the script through `env:`, never interpolated into the command line
      # (the same rule cut-release-normalize.py states in platform).
      - name: "the declared bump must agree with the computed bump (ticket 43, 18 Answer 5)"
        if: env.PUBLICATION_KIND == 'catalogue'
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: python3 .github/scripts/declared-bump-gate.py "${VERSION_INPUT}"

      - name: report declared bump and exact version
        if: env.PUBLICATION_KIND == 'report'
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: python3 .github/scripts/report-bump-gate.py "${VERSION_INPUT}"

      - name: validate the committed report without claiming a measured population
        if: env.PUBLICATION_KIND == 'report'
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 -m pip install -r publisher-reliability/requirements.txt
          case "$VERSION_INPUT" in
            publisher-reliability/v1.*) bash scripts/verify-publisher-reliability.sh ;;
            publisher-reliability/v2.*)
              sources=$(mktemp -d)
              python3 publisher-reliability/price_sources.py --root . \
                --report publisher-reliability/v2/feed.json --destination "$sources"
              bash scripts/verify-publisher-price-accuracy.sh --sources "$sources"
              ;;
            *) echo 'FAIL: unsupported report major'; exit 1 ;;
          esac

      - name: reject a tag that already exists (no force-move, ever)
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/${VERSION_INPUT}" >/dev/null 2>&1; then
            echo "FAIL: ${VERSION_INPUT} already exists -- tags are immutable here, cut a new version" >&2
            exit 1
          fi

      - name: create the signed annotated tag (ambient Actions identity, no interactive login)
        env:
          VERSION_INPUT: ${{ inputs.version }}
          MESSAGE_INPUT: ${{ inputs.message }}
        run: |
          set -euo pipefail
          git -c gpg.format=x509 -c gpg.x509.program=gitsign -c gitsign.rekorMode=offline \
            -c user.name="policy-as-versioned release bot" \
            -c user.email="releases@${GITHUB_REPOSITORY_OWNER}.invalid" \
            tag -s "${VERSION_INPUT}" -m "${MESSAGE_INPUT}"

      - name: push the tag (git push only -- never the git-data REST API)
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: git push origin "refs/tags/${VERSION_INPUT}"
