name: release

# Runs on every semver tag push. Verifies the tag's gitsign signature
# identity-pinned against an offline Rekor bundle, checks the tag still
# resolves to the commit this run was triggered from, runs the catalog's own
# offline verify script as a release gate, and publishes a GitHub Release.
# See cut-release.yml for how the tag gets here.
#
# EXPECTED_IDENTITY is cut-release.yml's own Actions identity (ambient
# credential, no human login) -- see that workflow's header comment for why.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

env:
  GITSIGN_VERSION: 0.17.1
  GITSIGN_SHA256: 69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae
  EXPECTED_IDENTITY: https://github.com/policy-as-versioned-nist/nist/.github/workflows/cut-release.yml@refs/heads/main
  EXPECTED_ISSUER: https://token.actions.githubusercontent.com

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: install pinned gitsign (binary + checksum, no marketplace action)
        run: |
          set -euo pipefail
          curl -sSL -o gitsign "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION}_linux_amd64"
          echo "${GITSIGN_SHA256}  gitsign" | sha256sum -c -
          chmod +x gitsign && sudo mv gitsign /usr/local/bin/gitsign

      - name: catalog offline verify (release gate)
        run: ./scripts/verify-catalog.sh

      - name: gitsign verify-tag, identity-pinned, offline Rekor bundle
        env:
          GITSIGN_REKOR_MODE: offline
        run: |
          set -euo pipefail
          # actions/checkout's second fetch flattens the annotated tag object
          # gitsign needs -- re-fetch the real tag ref before verifying it.
          git fetch origin "+refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}" --force
          gitsign verify-tag "${GITHUB_REF_NAME}" \
            --certificate-identity="${EXPECTED_IDENTITY}" \
            --certificate-oidc-issuer="${EXPECTED_ISSUER}"

      - name: tag still resolves to the commit this run was triggered from
        run: |
          set -euo pipefail
          resolved=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          if [ "${resolved}" != "${GITHUB_SHA}" ]; then
            echo "FAIL: tag ${GITHUB_REF_NAME} resolves to ${resolved}, run was triggered from ${GITHUB_SHA}"
            exit 1
          fi
          echo "OK: ${GITHUB_REF_NAME} -> ${resolved}"

      - name: publish GitHub Release recording the resolved SHA
        run: |
          set -euo pipefail
          {
            git tag -l --format='%(contents)' "${GITHUB_REF_NAME}" | sed '/^-----BEGIN SIGNED MESSAGE-----$/,$d'
            echo "---"
            echo "Verified gitsign signature (identity: ${EXPECTED_IDENTITY}, issuer: ${EXPECTED_ISSUER}). Resolved commit: ${GITHUB_SHA}."
          } > release-notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
