name: release

# Runs on every semver tag push. Verifies the tag's gitsign signature
# identity-pinned against an offline Rekor bundle, checks the tag still
# resolves to the commit this run was triggered from, runs the catalog's own
# offline verify script as a release gate, and publishes a GitHub Release.
# See cut-release.yml for how the tag gets here.
#
# EXPECTED_IDENTITY_REGEXP anchors cut-release.yml's own Actions identity
# (ambient credential, no human login) -- see that workflow's header comment
# for why -- allowing either refs/heads/main or a release/<major>.<minor>.x
# maintenance branch, since a backport is dispatched from the latter.
#
# Also accepts workflow_dispatch: a workflow run started BY the default
# Actions credential (cut-release.yml's own `git push`) does not, by GitHub
# design, trigger other workflows -- the tag lands but this workflow's own
# `push: tags:` event never fires. workflow_dispatch is the documented way
# round that: verify+publish stays reachable for every tag, chained or not.

on:
  push:
    tags:
      - "v*.*.*"
      - "publisher-reliability/v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to verify + publish (workflow_dispatch path only)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GITSIGN_VERSION: 0.17.1
  GITSIGN_SHA256: 69213a8a0813a151e5a47d0060862952ff833a845d57309dff76f7ba6600abae
  EXPECTED_IDENTITY_REGEXP: ^https://github\.com/policy-as-versioned-nist/nist/\.github/workflows/cut-release\.yml@refs/heads/(main|release/[0-9]+\.[0-9]+\.x)$
  EXPECTED_ISSUER: https://token.actions.githubusercontent.com

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: select publication family and verification identity
        run: |
          set -euo pipefail
          case "$TAG" in
            publisher-reliability/v*)
              [[ "$TAG" =~ ^publisher-reliability/v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo 'FAIL: malformed report version'; exit 1; }
              echo 'PUBLICATION_KIND=report' >> "$GITHUB_ENV"
              echo 'EXPECTED_IDENTITY_REGEXP=^https://github\.com/policy-as-versioned-nist/nist/\.github/workflows/cut-release\.yml@refs/heads/main$' >> "$GITHUB_ENV"
              ;;
            v[0-9]*.[0-9]*.[0-9]*) echo 'PUBLICATION_KIND=catalogue' >> "$GITHUB_ENV" ;;
            *) echo 'FAIL: unknown publication family'; exit 1 ;;
          esac

      - name: install pinned gitsign (binary + checksum, no marketplace action)
        run: |
          set -euo pipefail
          curl -sSL -o gitsign "https://github.com/sigstore/gitsign/releases/download/v${GITSIGN_VERSION}/gitsign_${GITSIGN_VERSION}_linux_amd64"
          echo "${GITSIGN_SHA256}  gitsign" | sha256sum -c -
          chmod +x gitsign && sudo mv gitsign /usr/local/bin/gitsign

      - name: catalog offline verify (release gate)
        if: env.PUBLICATION_KIND == 'catalogue'
        run: ./scripts/verify-catalog.sh

      - name: gitsign verify-tag, identity-pinned, offline Rekor bundle
        env:
          GITSIGN_REKOR_MODE: offline
        run: |
          set -euo pipefail
          # actions/checkout's second fetch flattens the annotated tag object
          # gitsign needs -- re-fetch the real tag ref before verifying it.
          git fetch origin "+refs/tags/${TAG}:refs/tags/${TAG}" --force
          object=$(git rev-parse "refs/tags/${TAG}")
          [ "$(git cat-file -t "$object")" = tag ] || { echo 'FAIL: release needs an annotated tag'; exit 1; }
          if [ "$PUBLICATION_KIND" = report ]; then
            [ "$(git cat-file tag "$object" | sed -n '/^$/q; s/^tag //p')" = "$TAG" ] || { echo 'FAIL: signed report tag name differs'; exit 1; }
            commit=$(git rev-parse "$object^{commit}")
            git rev-list --first-parent refs/remotes/origin/main | grep -Fx "$commit" >/dev/null || { echo 'FAIL: report source is outside served main'; exit 1; }
          fi
          gitsign verify-tag "${TAG}" \
            --certificate-identity-regexp="${EXPECTED_IDENTITY_REGEXP}" \
            --certificate-oidc-issuer="${EXPECTED_ISSUER}"
          [ "$(git rev-parse "refs/tags/${TAG}")" = "$object" ] || { echo 'FAIL: tag moved during verification'; exit 1; }
          echo "VERIFIED_TAG_OBJECT=$object" >> "$GITHUB_ENV"

      - name: tag still resolves to the commit this run was triggered from
        # Only meaningful on the push-triggered path -- see the on: comment.
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          resolved=$(git rev-parse "${VERIFIED_TAG_OBJECT}^{commit}")
          if [ "${resolved}" != "${GITHUB_SHA}" ]; then
            echo "FAIL: tag ${TAG} resolves to ${resolved}, run was triggered from ${GITHUB_SHA}"
            exit 1
          fi
          echo "OK: ${TAG} -> ${resolved}"

      - name: verify report from the exact authenticated source
        if: env.PUBLICATION_KIND == 'report'
        run: |
          set -euo pipefail
          git checkout --detach "${VERIFIED_TAG_OBJECT}^{commit}"
          python3 -m pip install -r publisher-reliability/requirements.txt
          case "$TAG" in
            publisher-reliability/v1.*) version_file=version.json; checker=report.py ;;
            publisher-reliability/v2.*) version_file=price-version.json; checker=price_report.py ;;
            *) echo 'FAIL: unsupported report major'; exit 1 ;;
          esac
          version=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["version"])' "publisher-reliability/$version_file")
          [ "$TAG" = "publisher-reliability/v${version}" ] || { echo 'FAIL: report version differs from its signed tag'; exit 1; }
          python3 "publisher-reliability/$checker" check --root . \
            --report "publisher-reliability/v${version%%.*}/feed.json" >/dev/null
          echo 'PASS: authenticated report recomputes; the declared population and criterion delimit any measurement'

      - name: publish GitHub Release recording the resolved SHA
        run: |
          set -euo pipefail
          [ "$(git rev-parse "refs/tags/${TAG}")" = "$VERIFIED_TAG_OBJECT" ] || { echo 'FAIL: verified tag moved before publication'; exit 1; }
          resolved=$(git rev-parse "${VERIFIED_TAG_OBJECT}^{commit}")
          {
            git tag -l --format='%(contents)' "${TAG}" | sed '/^-----BEGIN SIGNED MESSAGE-----$/,$d'
            echo "---"
            echo "Verified gitsign signature (identity regexp: ${EXPECTED_IDENTITY_REGEXP}, issuer: ${EXPECTED_ISSUER}). Resolved commit: ${resolved}."
          } > release-notes.md
          gh release create "${TAG}" \
            --title "${TAG}" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
